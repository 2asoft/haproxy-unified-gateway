stages:
  - bots
  - diff
  - lint
  - security
  - build
  - unit-tests
variables:
  KIND: v0.27.0
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  GO_VERSION: "1.25"
  DOCKER_VERSION: "26.0"

include:
  - local: .gitlab/bots.yml
  - local: .gitlab/diff.yml
  - local: .gitlab/lint.yml
  - local: .gitlab/security.yml
  - local: .gitlab/unit-tests.yml

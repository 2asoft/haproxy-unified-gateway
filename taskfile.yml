#https://taskfile.dev/
version: '3'

env:
  TASK_INTERNAL: true

includes:
  vars:
    taskfile: taskfile/.vars.yml
    flatten: true
  kind:
    taskfile: taskfile/kind.yml
    flatten: true
  kubectl:
    taskfile: taskfile/kubectl.yml
    flatten: true
  git:
    taskfile: taskfile/git.yml
    flatten: true
  generate:
    taskfile: taskfile/generate.yml
    flatten: true
  haproxy:
    taskfile: taskfile/haproxy.yml
    flatten: true
  go-tools:
    taskfile: taskfile/go-tools.yml
    flatten: true
  controller-gen:
    taskfile: taskfile/controller-gen.yml
    flatten: true
  envtest:
    taskfile: taskfile/envtest.yml
    flatten: true

vars:

tasks:

  ci:
    desc: 'do almost all the checks'
    cmds:
      - task: check-commit
      - task: tidy
      - task: format
      - task: generate
      - task: controller-gen
      - task: lint
      - task: test

  test:
    desc: 'run Go tests'
    vars:
      PACKAGE: setup-envtest
      VERSION: release-0.20
    cmds:
      #- task: download-gateway-crds
      - task: install-envtest-setup-tool
      - task: set-kubebuilderasset
      - |
        KUBEBUILDER_ASSETS=$(cat /{{.TMP}}/.kubebuilder_assets_path)
        KUBEBUILDER_ASSETS=$KUBEBUILDER_ASSETS go test -v -count=1 ./...

  tidy:
    internal: true
    desc: 'run Go mod tidy'
    cmds:
      - go mod tidy

  lint:
    desc: 'run Go linters'
    deps:
      - task: check-go-tool
        vars:
          PACKAGE: betteralign
      - task: check-go-tool
        vars:
          PACKAGE: revive
      - task: check-go-tool
        vars:
          PACKAGE: staticcheck
    vars:
      BA_VERSION:
        sh: yq eval '.betteralign.version' taskfile-tools.yml
      RV_VERSION:
        sh: yq eval '.revive.version' taskfile-tools.yml
      SC_VERSION:
        sh: yq eval '.staticcheck.version' taskfile-tools.yml
    cmds:
      - /{{.TMP}}/revive/{{.RV_VERSION}}/revive -config revive.toml -formatter friendly -set_exit_status ./...
      - /{{.TMP}}/staticcheck/{{.SC_VERSION}}/staticcheck ./...
      - /{{.TMP}}/betteralign/{{.BA_VERSION}}/betteralign ./...

  format:
    internal: true
    desc: 'formats the code'
    deps:
      - task: check-go-tool
        vars:
          PACKAGE: 'gofumpt'
    vars:
      VERSION:
        sh: yq eval '.gofumpt.version' taskfile-tools.yml
    cmds:
      - /{{.TMP}}/gofumpt/{{.VERSION}}/gofumpt -l -w .

  licenses:
    internal: true
    dir: cmd/controller
    desc: 'check licenses'
    deps:
      - task: check-go-tool
        vars:
          PACKAGE: 'go-licenses'
    vars:
      VERSION:
        sh: yq eval '.go-licenses.version' ./../../taskfile-tools.yml
    cmds:
      - |
          PROJECT="$(go list -m)"
          ALLOWED_LICENSES="$(<../../.allowed_license_types)"
          /{{.TMP}}/go-licenses/{{.VERSION}}/go-licenses report --ignore "$PROJECT" --ignore "github.com/modern-go/reflect2" --ignore "golang.org/x/sys" --ignore "golang.org/x/sys/unix"  .
          /{{.TMP}}/go-licenses/{{.VERSION}}/go-licenses check --allowed_licenses="$ALLOWED_LICENSES" --ignore "$PROJECT"  --ignore "github.com/modern-go/reflect2" --ignore "github.com/modern-go/reflect2" --ignore "golang.org/x/sys/unix"  .

  check-commit:
    #internal: true
    deps:
      - task: check-go-tool
        vars:
          PACKAGE: 'check-commit'
    vars:
      VERSION:
        sh: yq eval '.check-commit.version' taskfile-tools.yml
    cmds:
      - /{{.TMP}}/check-commit/{{.VERSION}}/check-commit

  govulncheck:
    internal: true
    deps:
      - task: check-go-tool
        vars:
          PACKAGE: 'govulncheck'
    vars:
      VERSION:
        sh: yq eval '.govulncheck.version' taskfile-tools.yml
    cmds:
      - /{{.TMP}}/govulncheck/{{.VERSION}}/govulncheck -show verbose ./...

  legal:
    desc: 'check legal'
    cmds:
      - task: govulncheck
      - task: licenses

  controller-gen:
    cmds:
      - task: controller-gen-deep-copy
      - task: controller-gen-manifest

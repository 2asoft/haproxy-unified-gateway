#https://taskfile.dev/
version: '3'

env:
  TASK_INTERNAL: true

includes:
  kind:
    taskfile: taskfile/kind.yml
    flatten: true
  kubectl:
    taskfile: taskfile/kubectl.yml
    flatten: true
  git:
    taskfile: taskfile/git.yml
    flatten: true
  lint:
    taskfile: taskfile/golang-ci-lint.yml
    flatten: true
  generate:
    taskfile: taskfile/generate.yml
    flatten: true
  haproxy:
    taskfile: taskfile/haproxy.yml
    flatten: true

tasks:

  ci:
    desc: 'do almost all the checks'
    cmds:
      - task: check-commit
      - task: tidy
      - task: format
      - task: generate
      - task: lint
      - task: test

  test:
    desc: 'run Go tests'
    cmds:
      - go test -v ./...

  tidy:
    internal: true
    desc: 'run Go mod tidy'
    cmds:
      - go mod tidy

  lint:
    desc: 'run Go linters'
    deps: [lint-version]
    cmds:
      - "{{.TMP_DIR}}/golangci-lint/{{.GOLANGCI_LINT_VERSION}}/golangci-lint run --timeout 15m --color always --max-issues-per-linter 0 --max-same-issues 0"
      - go tool -modfile tools/go.mod betteralign ./...

  format:
    internal: true
    desc: 'formats the code'
    cmds:
      - go tool -modfile tools/go.mod gofumpt -l -w .

  licenses:
    internal: true
    dir: cmd/controller
    desc: 'check licenses'
    cmds:
      - |
          PROJECT="$(go list -m)"
          ALLOWED_LICENSES="$(<../../.allowed_license_types)"
          go tool -modfile tools/go.mod go-licenses report --ignore "$PROJECT" --ignore "github.com/golang/freetype/raster" --ignore "github.com/golang/freetype/truetype" --ignore "oss.terrastruct.com/d2" .
          go tool -modfile tools/go.mod go-licenses check --allowed_licenses="$ALLOWED_LICENSES" --ignore "$PROJECT"  --ignore "github.com/oktalz/present" --ignore "github.com/golang/freetype/raster" --ignore "github.com/golang/freetype/truetype" --ignore "oss.terrastruct.com/d2" .

  check-commit:
    cmds:
      - cmd: go tool -modfile tools/go.mod check-commit
        platform: linux/amd64

  govulncheck:
    internal: true
    cmds:
      - go tool -modfile tools/go.mod govulncheck -show verbose ./...

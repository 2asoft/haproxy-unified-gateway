ControllerConf:
    name: ControllerConf
    comment: ""
    args:
        - name: controllerConf
          type: types.NamespacedName
ControllerName:
    name: ControllerName
    comment: ""
    args:
        - name: controllerName
          type: string
ControllerPodConfig:
    name: ControllerPodConfig
    comment: ""
    args:
        - name: controllerPodConfig
          type: config.ControllerPodConfig
GatewayClass:
    name: GatewayClass
    comment: ""
    args:
        - name: gatewayClass
          type: string
KubeConfig:
    name: KubeConfig
    comment: ""
    args:
        - name: kubeconfig
          type: string
LeaderElectionConfig:
    name: LeaderElectionConfig
    comment: ""
    args:
        - name: leaderElection
          type: config.LeaderElectionConfig
Logging:
    name: Logging
    comment: ""
    args:
        - name: level
          type: slog.Level
        - name: allowedCategories
          type: '*ast.ArrayType'
MetricsConfig:
    name: MetricsConfig
    comment: |
        ControllerPodConfig sets the ControllerPodConfig of the controller.
    args:
        - name: metricsConfig
          type: config.MetricsConfig
SyncPeriod:
    name: SyncPeriod
    comment: ""
    args:
        - name: syncPeriod
          type: time.Duration
TreeChannel:
    name: TreeChannel
    comment: ""
    args:
        - name: treeCh
          type: '*ast.ChanType'
WhiteListNamespaces:
    name: WhiteListNamespaces
    comment: ""
    args:
        - name: whitelistNs
          type: '*ast.ArrayType'

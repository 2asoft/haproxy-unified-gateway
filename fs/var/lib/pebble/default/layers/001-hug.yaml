summary: Manage the HAPRoxy and HUG processes

services:

    haproxy:
        override: replace
        command: /var/lib/pebble/default/run-haproxy
        startup: enabled
        on-success: ignore
        on-failure: restart

    hug:
        override: replace
        command: /var/lib/pebble/default/run-hug
        startup: enabled
        on-success: restart
        on-failure: restart
        after:
            - haproxy

checks:
    check-haproxy:
        override: replace
        exec:
            command: "curl --fail --unix-socket /var/run/haproxy/health.sock http://localhost/healthz"

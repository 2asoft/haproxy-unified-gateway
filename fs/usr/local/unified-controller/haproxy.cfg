# _version=1
# HAProxy Technologies
# https://www.haproxy.com/
#
# this file is not meant to be changed directly
# it is under haproxy ingress controller management
#

global
  daemon
  localpeer local
  master-worker
  pidfile /var/run/haproxy.pid
  stats socket /var/run/haproxy-runtime-api.sock level admin expose-fd listeners
  default-path config

defaults haproxytech
  timeout http-request 5000
  timeout connect 5000
  timeout client 50000
  timeout queue 5000
  timeout server 50000
  timeout tunnel 3600000
  timeout http-keep-alive 60000

peers localinstance
  peer local 127.0.0.1:10000


frontend healthz from haproxytech
  mode http
  monitor-uri /healthz
  option dontlog-normal

frontend stats from haproxytech
  mode http
  http-request set-var(txn.base) base
  http-request use-service prometheus-exporter if { path /metrics }
  stats enable
  stats uri /
  stats refresh 10s
  stats show-legends

backend be_tmp_test from haproxytech
  mode http
  server s1-L7OK-200_tmp_test 127.0.0.1:10001 check inter 1s

frontend s1-L7OK-200_tmp_test from haproxytech # L7OK/200
  mode http
  bind :10001
  http-request return status 200 content-type html string OK

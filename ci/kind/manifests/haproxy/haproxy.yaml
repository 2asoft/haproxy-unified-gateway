kind: Deployment
apiVersion: apps/v1
metadata:
  name: haproxy
  namespace: haproxy
spec:
  replicas: 2
  selector:
    matchLabels:
      run: haproxy
  template:
    metadata:
      labels:
        run: haproxy
    spec:
      containers:
        - name: haproxy
          image: "haproxytech/haproxy-alpine:3.1"
          #image: "haproxytech/haproxy"
          imagePullPolicy: Never
          resources:
            limits:
              memory: 2560Mi
            requests:
              memory: 2048Mi
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
---
kind: Service
apiVersion: v1
metadata:
  name: haproxy
  namespace: haproxy
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
    - name: https
      protocol: TCP
      port: 443
      targetPort: https
  selector:
    run: haproxy

from: haproxytech
metadata:
  hug:
    Gateway:
      e2e-tests-gateway-tls-multiple/gateway:
        Generation: 1
        LinkID: hug
mode: http
name: hug_https_8443
binds:
  v4:
    crt_list: /tmp/hug/e2e-tests-gateway-tls-multiple/certlists/hug_https_8443.list
    name: v4
    ssl: true
    address: 0.0.0.0
    port: 8443
  v6:
    crt_list: /tmp/hug/e2e-tests-gateway-tls-multiple/certlists/hug_https_8443.list
    name: v6
    ssl: true
    address: '::'
    port: 8443
default_backend: backend_not_found

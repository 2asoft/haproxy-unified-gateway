#https://taskfile.dev/
version: '3'

tasks:
  lint-check-latest-version:
    internal: true
    desc: 'Check if golangci-lint is up to date'
    silent: true
    cmds:
      - |
        if [ "{{.LATEST_VERSION}}" != "v{{.CURRENT_VERSION}}" ]; then
          echo "golangci-lint can be updated from v{{.CURRENT_VERSION}} to {{.LATEST_VERSION}}"
        fi
    vars:
      YQ_VERSION:
        sh: yq eval '.yq.version' go-tools.yml
      LATEST_VERSION:
        sh: GO111MODULE=on go list -m -versions -json github.com/golangci/golangci-lint | yq -r '.Versions[-1]'
      CURRENT_VERSION:
        sh: /{{.TMP}}/golangci-lint/{{.GOLANGCI_LINT_VERSION}}/golangci-lint --version | awk '{print $4}'

  lint-version:
    internal: true
    silent: true
    deps:
      - task: lint-check-latest-version
    status:
      - "/{{.TMP}}/golangci-lint/{{.GOLANGCI_LINT_VERSION}}/golangci-lint --version | grep -q '{{.GOLANGCI_LINT_VERSION}}'"
    cmds:
      - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /{{.TMP}}/golangci-lint/{{.GOLANGCI_LINT_VERSION}} "v{{.GOLANGCI_LINT_VERSION}}"

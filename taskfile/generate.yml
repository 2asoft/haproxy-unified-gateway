#https://taskfile.dev/
version: '3'

tasks:

  generate-doc-options:
    internal: true
    desc: 'run doc options generation'
    dir: ./cmd/doc-options
    cmds:
      - go run .

  generate:
    internal: true
    desc: 'run generation'
    cmds:
      - go generate -x ./...
      - task : generate-doc-options

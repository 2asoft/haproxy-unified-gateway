#https://taskfile.dev/
version: '3'

tasks:

  generate-doc-options:
    internal: true
    desc: 'run doc options generation'
    dir: ./cmd/doc-options
    cmds:
      - go run .

  generate-gwapi:
    desc: 'regenerate Gateway API version-dependent files from GWAPI_VERSIONS'
    cmds:
      - go run ./cmd/generate-gwapi

  generate:
    desc: 'run generation'
    cmds:
      - go generate -x ./...
      - task : generate-doc-options
      - task : generate-gwapi

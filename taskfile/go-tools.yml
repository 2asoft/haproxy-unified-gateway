#https://taskfile.dev/
version: '3'

tasks:

  check-latest-version-go:
    desc: 'check-latest-version'
    internal: true
    silent: true
    vars:
      PKG:
        sh: yq eval '.{{.PACKAGE}}.install | sub("/cmd/.*", "")' taskfile-tools.yml
      LATEST_PACKAGE_VERSION:
        sh: |
          GO111MODULE=on go list -m -versions -json {{.PKG}} | \
          yq eval '.Versions | map(select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .[-1]' -

    status:
      - "{{ if eq .LATEST_PACKAGE_VERSION .CURRENT_VERSION }}true{{ else }}false{{ end }}"
    cmds:
      - cmd: echo "{{.PACKAGE}} can be updated from {{.CURRENT_VERSION}} to {{.LATEST_PACKAGE_VERSION}}"

  go-install:
    desc: ""
    silent: true
    internal: true
    cmds:
      - go install {{.PACKAGE}}
    env:
      GOBIN: "{{.GOBIN}}"

  check-go-tool:
    desc: 'install go tool'
    internal: true
    silent: true
    deps:
      - task: check-latest-version-go
        vars:
          PACKAGE: '{{.PACKAGE}}'
          CURRENT_VERSION: '{{.CURRENT_VERSION}}'
    status:
      - "{{ if eq .CURRENT_VERSION .VERSION }}true{{ else }}false{{ end }}"
    vars:
      VERSION:
        sh: yq eval '.{{.PACKAGE}}.version' taskfile-tools.yml
      URL:
        sh: yq eval '.{{.PACKAGE}}.install' taskfile-tools.yml
      CURRENT_VERSION:
        sh: go version -m /{{.TMP}}/{{.PACKAGE}}/{{.VERSION}}/{{.PACKAGE}} | awk '$1 == "mod" {print $3}'
    cmds:
      - task : go-install
        vars:
          PACKAGE: '{{.URL}}@{{.VERSION}}'
          GOBIN: '/{{.TMP}}/{{.PACKAGE}}/{{.VERSION}}'
      - echo "Installed {{.PACKAGE}} {{.VERSION}} in /{{.TMP}}/{{.PACKAGE}}/{{.VERSION}}"

  check-go-tools:
    desc: 'install go tools if they are not installed'
    internal: true
    silent: true
    vars:
      PACKAGES:
        sh: yq eval 'keys | join(",")' taskfile-tools.yml
    cmds:
      - for: { var: PACKAGES, split: ',' }
        task: check-go-tool
        vars:
          PACKAGE: '{{.ITEM}}'

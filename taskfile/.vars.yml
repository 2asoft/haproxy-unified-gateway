#https://taskfile.dev/
version: "3"

env:
  KUBECTL_VERSION: v1.35.0
  K8S_VERSION: v1.35.0
  GWAPI_VERSIONS: v1.3.0, v1.4.0, v1.5.0
  GWAPI_EXP_VERSIONS: v1.5.0
  ENVTEST_VERSION: v1.35.0 # https://raw.githubusercontent.com/kubernetes-sigs/controller-tools/master/envtest-releases.yaml
  CLUSTER_NAME: '{{ default "dev-controller" .CLUSTER_NAME}}'
  DOCKER_FILE: '{{ default "-build/Dockerfile" .DOCKER_FILE}}'
  TMP: tmp

vars:
  CONFIG_DIR: "example/deploy"
  DEV_INIT_DIR: "example/dev-init"
  API_DEFINITION_DIR: "api/definition"

#https://taskfile.dev/
version: '3'

tasks:

  check-if-gitlab-env:
    internal: true
    cmds:
      - '[ -z "$GITLAB_CI" ] && exit 1 || exit 0'
  check-if-ci-env:
    internal: true
    cmds:
      - '[ -z "$CI_ENV" ]    && exit 1 || exit 0'
  check-if-not-ci-env:
    internal: true
    cmds:
      - '[ -z "$CI_ENV" ]    && exit 0 || exit 1'
  delimiter:
    internal: true
    cmds:
      - cmd: printf %80s |tr " " "="; echo ""
        silent: true

  kind-create-cluster:
    #internal: true
    deps:
      - task: check-go-tool
        vars:
          PACKAGE: kind
    desc: 'create a KinD cluster with controller'
    status:
      - task check-if-ci-env # check if we are in CI_ENV, if we are, skip this task
    dir: 'ci/kind' # this file is imported so its fine
    cmds:
      - /{{.TMP}}/kind/{{.KIND_VERSION}}/kind delete cluster --name {{.CLUSTER_NAME}}
      - /{{.TMP}}/kind/{{.KIND_VERSION}}/kind create cluster --name {{.CLUSTER_NAME}} --config kind-config.yaml

  kind-controller-build:
    desc: ''
    internal: true
    dir: cmd/controller
    cmds:
      - CGO_ENABLED=0 go build -o ../../build/kubernetes-controller .

  kind-build-controller-image:
    #internal: true
    desc: 'build docker image of controller'
    #dir: build
    deps:
      - task: kind-controller-build
    status:
      - task check-if-gitlab-env # check if we are in gitlab CI, if we are skip this task
    cmds:
      - docker build -t haproxytech/kubernetes-controller -f build/Dockerfile .
      - rm build/kubernetes-controller

  kind-build-echo-image:
    internal: true
    desc: 'build docker image of echo service'
    dir: ci/http-echo
    status:
      - docker images | grep haproxytech/http-echo
    cmds:
      - pwd
      - docker build --build-arg TARGETPLATFORM={{.TARGETPLATFORM}} -t haproxytech/http-echo .

  kind-delete:
    desc: 'delete a KinD cluster'
    silent: true
    deps:
      - task: check-go-tool
        vars:
          PACKAGE: kind
    cmds:
      - "/{{.TMP}}/kind/{{.KIND_VERSION}}/kind delete cluster --name {{.CLUSTER_NAME}}"

  kind-create:
    desc: 'create a KinD cluster with IC and one example app'
    silent: true
    cmds:
      - task: delimiter
      - task: kind-create-cluster
      - task: delimiter
      - task: kind-build-controller-image
      - task: kind-build-echo-image
      - task: delimiter
      - cmd: /{{.TMP}}/kind/{{.KIND_VERSION}}/kind load docker-image haproxytech/kubernetes-controller:latest --name={{.CLUSTER_NAME}}
      - cmd: /{{.TMP}}/kind/{{.KIND_VERSION}}/kind load docker-image haproxytech/http-echo:latest --name={{.CLUSTER_NAME}}
      - task: delimiter
      - echo "Create HAProxy namespace ..."
      - kubectl apply -f {{.CONFIG_DIR}}/controller/namespace.yaml
      - task: delimiter
      - echo "Install custom resource definitions ..."
      - echo "Install Gateway API CRDs"
      - kubectl apply -f {{.GATEWAYAPI_CRDS_DOWNLOAD_URL}}
      - echo "Install Gateway API Controller CRDs"
      - kubectl apply -f {{.API_DEFINITION_DIR}}/gate.v3.haproxy.org_haproxygatectrlcfgs.yaml
      - kubectl apply -f {{.API_DEFINITION_DIR}}/gate.v3.haproxy.org_haproxygates.yaml
      #- kubectl apply -f {{.CONFIG_DIR}}/crd/rbac.yaml
      #- kubectl apply -f {{.CONFIG_DIR}}/crd/job-crd.yaml
      #- kubectl wait --for=condition=complete --timeout=60s job/haproxy-ingress-crd -n haproxy-controller
      - task: delimiter
      - echo "deploying Controller ..."
      - kubectl apply -f {{.CONFIG_DIR}}/controller/rbac.yaml
      - kubectl apply -f {{.CONFIG_DIR}}/controller/controller.yaml
      - task: delimiter
      - echo "deploying echo service ..."
      - kubectl apply -f {{.CONFIG_DIR}}/echo/echo.yaml
      - docker pull haproxytech/haproxy-alpine:3.1
      - /{{.TMP}}/kind/{{.KIND_VERSION}}/kind load docker-image haproxytech/kubernetes-controller:latest --name={{.CLUSTER_NAME}}
      #- /{{.TMP}}/kind/{{.KIND_VERSION}}/kind load docker-image haproxytech/haproxy --name={{.CLUSTER_NAME}}
      - task: delimiter
      - kubectl wait --for=condition=ready --timeout=10s pod -l run=haproxy-controller -n haproxy-controller

  kind-redeploy-controller:
    deps:
      - task: check-go-tool
        vars:
          PACKAGE: kind
    desc: 'redeploy a KinD cluster with IC'
    silent: true
    cmds:
      - task: kind-build-controller-image
      - task: delimiter
      - cmd: /{{.TMP}}/kind/{{.KIND_VERSION}}/kind load docker-image haproxytech/kubernetes-controller:latest --name={{.CLUSTER_NAME}}
      - task: delimiter
      - echo "deploying Controller ..."
      - kubectl apply -f {{.CONFIG_DIR}}/controller/rbac.yaml
      - kubectl apply -f {{.CONFIG_DIR}}/controller/controller.yaml
      - task: delimiter
      - kubectl delete pods -l run=haproxy-controller -n haproxy-controller
      - kubectl wait --for=condition=ready --timeout=10s pod -l run=haproxy-controller -n haproxy-controller

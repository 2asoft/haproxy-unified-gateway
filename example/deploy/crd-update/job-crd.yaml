apiVersion: batch/v1
kind: Job
metadata:
  name: haproxy-unified-gateway-crd # job name must be unique for each run
  namespace: haproxy-unified-gateway
spec:
  template:
    spec:
      serviceAccountName: haproxy-unified-gateway-crd
      containers:
      - name: haproxy-unified-gateway-crd
        image: haproxytech/haproxy-unified-gateway:latest
        # imagePullPolicy: this is set to never for kind cluster usage
        # imagePullPolicy: Always
        imagePullPolicy: Never
        command: ["/usr/local/sbin/hug","--job-check-crd"]
      restartPolicy: Never
  backoffLimit: 0

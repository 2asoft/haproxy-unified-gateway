apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-1
spec:
  parentRefs:
  - name: gateway-1
    sectionName: http
  hostnames:
  - "example.haproxy"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /route1
    backendRefs:
    - name: http-echo-1
      port: 80
      weight: 10
    - name: http-echo-2
      port: 80
      weight: 90
  - matches:
    - path:
        type: PathPrefix
        value: /route11
    backendRefs:
    - name: http-echo-3
      port: 80

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: all-multi-backend-route
  namespace: default
spec:
  parentRefs:
  - name: gateway
    sectionName: http # Assumes a Listener on port 80
  hostnames:
  - "multi-app.example.com"

  rules:

  # -------------------------------------------------------------------
  # Rule 1: Redirect with a Rule-Level Filter
  # 🛑 IMPORTANT: A RequestRedirect filter is terminal. Although multiple
  # backends are defined, the redirect is sent to the client FIRST,
  # and the backends are NEVER reached. This shows the priority of the
  # Rule-Level Filter.
  # -------------------------------------------------------------------
  - matches:
    - path:
        type: PathPrefix
        value: /redirect-check

    # 🛑 RULE-LEVEL FILTER: Applied to ALL matching traffic BEFORE forwarding
    filters:
    - type: RequestRedirect
      requestRedirect:
        statusCode: 301 # Client is permanently redirected
        hostname: "new-site.example.com"

    # BACKENDS: These are defined but will NOT be reached due to the Redirect filter
    backendRefs:
    - name: backend-a-svc
      port: 80
      weight: 50
    - name: backend-b-svc
      port: 80
      weight: 50

---

  # -------------------------------------------------------------------
  # Rule 2: Path Rewrite with a Rule-Level Filter
  # - All traffic matching /rewrite-split is universally rewritten to
  #   /internal-api, and then split 70/30 between two backends.
  # -------------------------------------------------------------------
  - matches:
    - path:
        type: PathPrefix
        value: /rewrite-split

    # 🛠️ RULE-LEVEL FILTER: The path is modified BEFORE the traffic split happens.
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /internal-api # External /rewrite-split becomes internal /internal-api

    # BACKENDS: Traffic is split 70/30 (total weight = 100)
    backendRefs:
    - name: stable-api-svc
      port: 8080
      weight: 70
    - name: experimental-api-svc
      port: 8080
      weight: 30

---

  # -------------------------------------------------------------------
  # Rule 3: Weighted Split with a Backend-Level Filter
  # - Splits traffic: 90% to v1 (stable), 10% to v2 (canary).
  # - ONLY the 10% canary traffic gets a custom header.
  # -------------------------------------------------------------------
  - matches:
    - path:
        type: PathPrefix
        value: /canary-tag

    # BACKENDS: Traffic is split 90/10 (total weight = 100)
    backendRefs:

    # Stable Backend: Receives 90% of traffic. No filters.
    - name: app-v1-svc
      port: 80
      weight: 90

    # Canary Backend: Receives 10% of traffic.
    - name: app-v2-svc
      port: 80
      weight: 10
      # 🏷️ BACKEND-LEVEL FILTER: Applied ONLY to the 10% of traffic for V2.
      filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          set:
          - name: X-Canary-Flag
            value: "active"

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway2
spec:
  gatewayClassName: haproxy
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: "*.haproxy.local"
  - name: https
    protocol: HTTPS
    port: 443

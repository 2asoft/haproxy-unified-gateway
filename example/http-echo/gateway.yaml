apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
spec:
  gatewayClassName: haproxy
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      kinds:
      - #group: gateway.networking.k8s.io
        kind: TLSRoute
    # hostname: "*.haproxy.local"hostname: "*.haproxy.local"
  # - name: admin
  #   port: 81
  #   protocol: HTTP
  #   hostname: "*.haproxy.local"
  - name: https
    protocol: HTTPS
    port: 443
    # tls:
    #   certificateRefs:
    #   - kind: Secret
    #     group: ""
    #     name: wildcard-haproxy-local-cert
  infrastructure:
    parametersRef:
      group: gate.v3.haproxy.org
      kind: HaproxyGate
      name: haproxygate2

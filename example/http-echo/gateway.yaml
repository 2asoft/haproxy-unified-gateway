apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
spec:
  gatewayClassName: haproxy
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: "*.haproxy.local"
  infrastructure:
    parametersRef:
      group: gate.v3.haproxy.org
      kind: HaproxyGate
      name: haproxygate2

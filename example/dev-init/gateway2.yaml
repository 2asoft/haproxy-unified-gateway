apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hug-gateway2
spec:
  gatewayClassName: haproxy
  listeners:
  - name: http
    port: 31080
    protocol: HTTP
    allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
    hostname: "*.haproxy2"
  - name: https
    protocol: HTTPS
    port: 31443
    hostname: "*.haproxy"
    tls:
      certificateRefs:
      - kind: Secret
        group: ""
        name: offload
    allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
  - name: https2
    port: 31080
    protocol: HTTPS
    hostname: "*.haproxy2"
    tls:
      certificateRefs:
      - kind: Secret
        group: ""
        name: offload
    allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute

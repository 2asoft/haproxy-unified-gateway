apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-echo-https
spec:
  parentRefs:
  - name: hug-gateway
    sectionName: https
  hostnames:
  - "offload.haproxy"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: http-echo
      port: 80
---

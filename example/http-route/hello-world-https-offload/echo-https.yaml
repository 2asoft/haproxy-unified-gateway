kind: Deployment
apiVersion: apps/v1
metadata:
  name: hello-world-offload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world-offload
  template:
    metadata:
      labels:
        app: hello-world-offload
    spec:
      containers:
        - name: http-echo
          image: "haproxytech/http-echo:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
---
kind: Service
apiVersion: v1
metadata:
  name: hello-world-offload
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
    - name: https
      protocol: TCP
      port: 443
      targetPort: https
  selector:
    app: hello-world-offload

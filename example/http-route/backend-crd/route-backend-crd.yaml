
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-backend-crd
spec:
  parentRefs:
  - name: hug-gateway
    sectionName: http
  hostnames:
  - "backendcrd.haproxy.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: hello-world-backendcrd-1
      port: 80
      filters:
      - type: ExtensionRef
        extensionRef:
          group: gate.v3.haproxy.org
          kind: Backend
          name: backend-cr-1

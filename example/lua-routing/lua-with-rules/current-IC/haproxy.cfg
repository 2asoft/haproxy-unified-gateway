  http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map_beg(/etc/haproxy/maps/path-prefix.map) if !{ var(txn.path_match) -m found }
  http-request auth realm Protected-Content if { var(txn.path_match) -m dom 9a178dfeed75b5393e21fb20a834c7b4 } !{ http_auth_group(haproxy-controller-techdump) authenticated-users }

commit-policy:
  stage: lint
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  image:
    name: $CI_REGISTRY_GO/commit-check:5.4.0
    entrypoint: [""]
  tags:
    - go
  script:
      - /check
  artifacts:
    when: on_failure
    paths:
      - junit-report.xml
    reports:
      junit: junit-report.xml

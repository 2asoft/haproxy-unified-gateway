  stage: unit-tests
  image:
    name: $CI_REGISTRY_GO/haproxy-alpine:3.2-go$GO_VERSION
    entrypoint: [""]
  tags:
    - go
  before_script:
    - export PATH=$PATH:/root/go/bin
  script:
    - task test-todo
